<svg class="jake-portrait" viewBox="0 0 120 120" role="img" aria-label="Jake Taylor">
  <g>
    <rect width="120" height="120" fill="#cfe3f5"/>
    <!-- shoulders / shirt -->
    <path d="M14 120c2-22 20-32 46-32s44 10 46 32z" fill="#2f5d8a"/>
    <path d="M48 88l12 14 12-14-6-3-6 7-6-7z" fill="#ffffff"/>
    <rect x="70" y="96" width="12" height="15" rx="2" fill="#f4f6f9" stroke="#9fb3c8"/>
    <rect x="72.5" y="99" width="7" height="2" rx="1" fill="#2f5d8a"/>
    <path d="M60 92l12 6" stroke="#9fb3c8" stroke-width="1.5"/>
    <!-- neck -->
    <rect x="52" y="70" width="16" height="18" rx="6" fill="#d9a07a"/>
    <!-- ears -->
    <ellipse cx="37.5" cy="53" rx="4.5" ry="6.5" fill="#d9a07a"/>
    <ellipse cx="82.5" cy="53" rx="4.5" ry="6.5" fill="#d9a07a"/>
    <!-- head -->
    <ellipse cx="60" cy="51" rx="22.5" ry="25.5" fill="#e6b28c"/>
    <!-- hair -->
    <path d="M37 47c-1-17 10-25 23-25 14 0 25 7 24 24-4-8-10-11-17-12-7 4-19 6-30 13z" fill="#3b2a20"/>
    <!-- brows -->
    <path d="M45 43.5q5-3 10 0" stroke="#3b2a20" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M65 43.5q5-3 10 0" stroke="#3b2a20" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- eyes (blink) -->
    <g class="eyes">
      <ellipse cx="50" cy="51" rx="2.6" ry="3.1" fill="#2a2a2a"/>
      <ellipse cx="70" cy="51" rx="2.6" ry="3.1" fill="#2a2a2a"/>
      <circle cx="51" cy="50" r=".9" fill="#fff"/><circle cx="71" cy="50" r=".9" fill="#fff"/>
    </g>
    <!-- nose -->
    <path d="M60 54q-3 7 0 8.5q2 .5 3-.5" stroke="#b9805c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="45" cy="61" r="3.5" fill="#e99a86" opacity=".35"/>
    <circle cx="75" cy="61" r="3.5" fill="#e99a86" opacity=".35"/>
    <!-- mouth: closed smile / open (talking) -->
    <path class="mouth-closed" d="M52 66q8 6 16 0" stroke="#8a4a3a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <g class="mouth-open">
      <path d="M52 65.5q8 9 16 0z" fill="#7a3a2e"/>
      <path d="M55.5 69q4.5 2.5 9 0" stroke="#e58b84" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
